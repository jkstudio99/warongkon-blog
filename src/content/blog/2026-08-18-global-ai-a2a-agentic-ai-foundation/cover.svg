  </defs>
  <rect width="1280" height="720" fill="url(#bg)"/>
  <g opacity=".18" stroke="#d9f99d" stroke-width="2">
    <path d="M92 128H1188M92 248H1188M92 368H1188M92 488H1188M92 608H1188"/>
    <path d="M190 84V640M350 84V640M510 84V640M670 84V640M830 84V640M990 84V640M1150 84V640"/>
