<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">A2A agent interoperability cover</title>
  <desc id="desc">A network of AI agents exchanging signed tasks through a shared protocol layer.</desc>
  <defs>
