<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">A100 GPU lifecycle infrastructure cover</title>
  <desc id="desc">GPU boards, data center racks, and a timeline running from 2020 to 2029.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="1" y2="0">
      <stop offset="0%" stop-color="#06141f"/>
      <stop offset="45%" stop-color="#123524"/>
      <stop offset="100%" stop-color="#314d14"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#020617" flood-opacity="0.36"/>
    </filter>
  </defs>
  <rect width="1280" height="720" fill="url(#bg)"/>
  <rect x="74" y="70" width="1132" height="580" rx="30" fill="#04111b" opacity="0.44"/>
  <g filter="url(#shadow)">
    <rect x="168" y="152" width="300" height="372" rx="22" fill="#102a43"/>
    <rect x="812" y="152" width="300" height="372" rx="22" fill="#102a43"/>
    <g fill="#1f3b57">
      <rect x="196" y="190" width="244" height="52" rx="10"/>
      <rect x="196" y="260" width="244" height="52" rx="10"/>
      <rect x="196" y="330" width="244" height="52" rx="10"/>
      <rect x="196" y="400" width="244" height="52" rx="10"/>
      <rect x="840" y="190" width="244" height="52" rx="10"/>
      <rect x="840" y="260" width="244" height="52" rx="10"/>
      <rect x="840" y="330" width="244" height="52" rx="10"/>
      <rect x="840" y="400" width="244" height="52" rx="10"/>
    </g>
    <rect x="490" y="202" width="300" height="220" rx="28" fill="#d9f99d"/>
    <rect x="536" y="248" width="208" height="128" rx="18" fill="#122018"/>
    <text x="585" y="328" fill="#d9f99d" font-family="Arial, Helvetica, sans-serif" font-size="58" font-weight="800">A100</text>
    <g stroke="#d9f99d" stroke-width="10" stroke-linecap="round">
      <line x1="538" y1="182" x2="538" y2="132"/>
      <line x1="600" y1="182" x2="600" y2="132"/>
      <line x1="662" y1="182" x2="662" y2="132"/>
      <line x1="724" y1="182" x2="724" y2="132"/>
      <line x1="538" y1="492" x2="538" y2="442"/>
      <line x1="600" y1="492" x2="600" y2="442"/>
      <line x1="662" y1="492" x2="662" y2="442"/>
      <line x1="724" y1="492" x2="724" y2="442"/>
    </g>
  </g>
  <g font-family="Arial, Helvetica, sans-serif" font-weight="800">
    <text x="116" y="130" fill="#ecfccb" font-size="34">GPU LIFECYCLE BECOMES INFRASTRUCTURE</text>
    <text x="118" y="606" fill="#fef3c7" font-size="72">2020 -> 2029</text>
    <text x="780" y="606" fill="#bbf7d0" font-size="31">old chips, new inference work</text>
  </g>
  <g stroke="#86efac" stroke-width="6" stroke-linecap="round">
    <line x1="200" y1="560" x2="1080" y2="560"/>
    <circle cx="200" cy="560" r="14" fill="#86efac"/>
    <circle cx="640" cy="560" r="14" fill="#86efac"/>
    <circle cx="1080" cy="560" r="14" fill="#86efac"/>
  </g>
</svg>
