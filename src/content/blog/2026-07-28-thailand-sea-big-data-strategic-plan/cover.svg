<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">Thailand Big Data Strategic Plan cover</title>
  <desc id="desc">A Thailand data platform diagram connecting government cloud, AI, public services, and workforce goals.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1e1b4b"/>
      <stop offset="0.48" stop-color="#075985"/>
      <stop offset="1" stop-color="#14532d"/>
    </linearGradient>
    <linearGradient id="platform" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fef3c7"/>
      <stop offset="1" stop-color="#bfdbfe"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#020617" flood-opacity="0.4"/>
    </filter>
  </defs>
  <rect width="1280" height="720" fill="url(#bg)"/>
  <g opacity="0.18" stroke="#e0f2fe" stroke-width="2">
    <path d="M0 120H1280M0 240H1280M0 360H1280M0 480H1280M0 600H1280"/>
    <path d="M140 0V720M280 0V720M420 0V720M560 0V720M700 0V720M840 0V720M980 0V720M1120 0V720"/>
  </g>
  <g filter="url(#shadow)">
    <rect x="335" y="142" width="610" height="390" rx="36" fill="url(#platform)" stroke="#fef9c3" stroke-width="4"/>
    <text x="640" y="214" fill="#0f172a" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="40" font-weight="900">NATIONAL BIG DATA PLATFORM</text>
    <text x="640" y="260" fill="#164e63" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700">Thailand 2025-2027</text>
    <rect x="405" y="318" width="210" height="78" rx="16" fill="#0f172a"/>
    <rect x="665" y="318" width="210" height="78" rx="16" fill="#0f172a"/>
    <rect x="405" y="424" width="210" height="78" rx="16" fill="#0f172a"/>
    <rect x="665" y="424" width="210" height="78" rx="16" fill="#0f172a"/>
    <text x="510" y="366" fill="#bae6fd" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="800">Government Cloud</text>
    <text x="770" y="366" fill="#bbf7d0" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="800">Data Catalog</text>
    <text x="510" y="472" fill="#fde68a" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="800">Thai AI Data</text>
    <text x="770" y="472" fill="#fecaca" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="800">160K Talent</text>
  </g>
  <g filter="url(#shadow)" font-family="Arial, Helvetica, sans-serif">
    <rect x="70" y="120" width="210" height="112" rx="22" fill="#dbeafe"/>
    <text x="175" y="166" fill="#1e3a8a" text-anchor="middle" font-size="25" font-weight="800">Healthcare</text>
    <text x="175" y="201" fill="#1d4ed8" text-anchor="middle" font-size="19">public services</text>
    <rect x="70" y="470" width="210" height="112" rx="22" fill="#dcfce7"/>
    <text x="175" y="516" fill="#14532d" text-anchor="middle" font-size="25" font-weight="800">Tourism</text>
    <text x="175" y="551" fill="#166534" text-anchor="middle" font-size="19">economic data</text>
    <rect x="1000" y="120" width="210" height="112" rx="22" fill="#fef3c7"/>
    <text x="1105" y="166" fill="#92400e" text-anchor="middle" font-size="25" font-weight="800">Agriculture</text>
    <text x="1105" y="201" fill="#a16207" text-anchor="middle" font-size="19">domain AI</text>
    <rect x="1000" y="470" width="210" height="112" rx="22" fill="#fee2e2"/>
    <text x="1105" y="516" fill="#7f1d1d" text-anchor="middle" font-size="25" font-weight="800">Industry</text>
    <text x="1105" y="551" fill="#991b1b" text-anchor="middle" font-size="19">competitiveness</text>
  </g>
  <g stroke-linecap="round" stroke-linejoin="round" stroke-width="8" fill="none">
    <path d="M280 176H335" stroke="#bfdbfe"/>
    <path d="M280 526H335" stroke="#bbf7d0"/>
    <path d="M945 176H1000" stroke="#fde68a"/>
    <path d="M945 526H1000" stroke="#fecaca"/>
  </g>
  <text x="72" y="650" fill="#f8fafc" font-family="Arial, Helvetica, sans-serif" font-size="42" font-weight="900">THAILAND BIG DATA STRATEGIC PLAN</text>
  <text x="74" y="687" fill="#fef3c7" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700">data infrastructure for AI and digital government</text>
</svg>
