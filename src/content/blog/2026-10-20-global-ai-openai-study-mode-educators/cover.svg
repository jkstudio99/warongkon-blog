<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">AI-guided learning questions</title>
  <desc id="desc">An editorial illustration of a student desk, layered question cards, and a teacher-guided learning path.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#102a43"/><stop offset="1" stop-color="#1b6b73"/></linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#f8fafc"/><stop offset="1" stop-color="#d8eef0"/></linearGradient>
  </defs>
  <rect width="1280" height="720" fill="url(#bg)"/>
  <circle cx="1080" cy="122" r="172" fill="#57c2b9" opacity=".16"/>
  <circle cx="168" cy="624" r="220" fill="#f4c95d" opacity=".13"/>
  <rect x="174" y="120" width="932" height="490" rx="34" fill="#0c1f33" opacity=".76" stroke="#80ded9" stroke-opacity=".4"/>
  <text x="246" y="215" fill="#f8fafc" font-family="Arial, sans-serif" font-size="30" letter-spacing="4">AI FOR LEARNING</text>
  <text x="246" y="292" fill="#f4c95d" font-family="Arial, sans-serif" font-size="54" font-weight="700">Start with a question</text>
  <rect x="246" y="346" width="325" height="155" rx="20" fill="url(#card)"/>
  <text x="284" y="410" fill="#102a43" font-family="Arial, sans-serif" font-size="28" font-weight="700">What do you notice?</text>
  <text x="284" y="455" fill="#335c67" font-family="Arial, sans-serif" font-size="23">Think, explain, test.</text>
  <rect x="641" y="346" width="218" height="155" rx="20" fill="#57c2b9"/>
  <text x="684" y="429" fill="#082032" font-family="Arial, sans-serif" font-size="67" font-weight="700">?</text>
  <path d="M590 423h42m227 0h54" stroke="#f4c95d" stroke-width="8" stroke-linecap="round"/>
  <path d="M907 423l-25-18v36z" fill="#f4c95d"/>
  <rect x="921" y="346" width="135" height="155" rx="20" fill="#f8fafc" opacity=".94"/>
  <path d="M955 447c16-61 65-61 65 0" fill="none" stroke="#102a43" stroke-width="11" stroke-linecap="round"/>
  <circle cx="987" cy="397" r="26" fill="#f4c95d"/>
  <text x="246" y="562" fill="#cce7e6" font-family="Arial, sans-serif" font-size="24">A teacher keeps the judgment. A learner does the thinking.</text>
</svg>
