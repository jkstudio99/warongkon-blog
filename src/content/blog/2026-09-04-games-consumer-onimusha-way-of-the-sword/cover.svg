  <g font-family="Arial, Helvetica, sans-serif" fill="#f8efe1">
    <text x="88" y="124" font-size="34" font-weight="700" letter-spacing="0">GAMES / CONSUMER</text>
    <text x="88" y="184" font-size="64" font-weight="800" letter-spacing="0">ONIMUSHA</text>
    <text x="88" y="240" font-size="34" font-weight="700" letter-spacing="0" fill="#e7b26e">WAY OF THE SWORD</text>
