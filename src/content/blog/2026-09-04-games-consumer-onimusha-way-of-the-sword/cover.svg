    <circle cx="214" cy="159" r="3"/>
    <circle cx="1039" cy="402" r="4"/>
    <circle cx="1129" cy="501" r="6"/>
    <circle cx="411" cy="603" r="4"/>
    <circle cx="879" cy="103" r="4"/>
