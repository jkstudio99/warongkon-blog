<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">Onimusha Way of the Sword launch cover</title>
  <desc id="desc">A stylized dark fantasy game launch image with crossed blades, ember light, and Kyoto-inspired gates.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#151313"/>
      <stop offset="0.52" stop-color="#272029"/>
      <stop offset="1" stop-color="#0f1720"/>
    </linearGradient>
    <linearGradient id="ember" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#b22d2b"/>
      <stop offset="0.55" stop-color="#e0893f"/>
      <stop offset="1" stop-color="#f4d597"/>
    </linearGradient>
    <linearGradient id="steel" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#717987"/>
      <stop offset="0.45" stop-color="#f1eadb"/>
      <stop offset="1" stop-color="#68717f"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
  </defs>
  <rect width="1280" height="720" fill="url(#bg)"/>
  <path d="M0 534 C160 490 301 564 456 520 C620 474 734 486 889 525 C1047 565 1164 519 1280 493 L1280 720 L0 720 Z" fill="#0b0d10" opacity="0.72"/>
  <circle cx="982" cy="162" r="132" fill="#c84035" opacity="0.18" filter="url(#soft)"/>
  <circle cx="276" cy="584" r="170" fill="#e08a3e" opacity="0.14" filter="url(#soft)"/>
  <g opacity="0.2" stroke="#f0d6ac" stroke-width="10" fill="none">
    <path d="M210 426 H489"/>
    <path d="M245 426 V332 H454 V426"/>
    <path d="M278 332 V288 H421 V332"/>
  </g>
  <g transform="translate(640 356)">
    <rect x="-16" y="-350" width="32" height="700" rx="14" fill="url(#steel)" transform="rotate(42)"/>
    <rect x="-16" y="-350" width="32" height="700" rx="14" fill="url(#steel)" transform="rotate(-42)"/>
    <rect x="-24" y="112" width="48" height="170" rx="22" fill="#28231f" transform="rotate(42)"/>
    <rect x="-24" y="112" width="48" height="170" rx="22" fill="#28231f" transform="rotate(-42)"/>
    <rect x="-120" y="-5" width="240" height="18" rx="9" fill="url(#ember)" transform="rotate(42)"/>
    <rect x="-120" y="-5" width="240" height="18" rx="9" fill="url(#ember)" transform="rotate(-42)"/>
