      <path d="M-98 362 H565"/>
    </g>
    <g transform="translate(470 70)" stroke="#f6f7f8" stroke-width="5">
      <path d="M0 250 L70 0 L140 250"/>
      <path d="M32 90 H108 M22 145 H118 M12 205 H128"/>
