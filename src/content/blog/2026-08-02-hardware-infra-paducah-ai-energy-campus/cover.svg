<svg width="1280" height="720" viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Paducah AI energy campus cover</title>
  <desc id="desc">Editorial cover showing an AI data center campus connected to gas power, battery storage, and grid infrastructure.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#17324a"/>
      <stop offset="0.58" stop-color="#24313d"/>
      <stop offset="1" stop-color="#15191e"/>
    </linearGradient>
    <linearGradient id="power" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8fd14f"/>
      <stop offset="1" stop-color="#49c6e5"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="720" fill="url(#sky)"/>
  <rect x="0" y="490" width="1280" height="230" fill="#12171b"/>
  <g opacity="0.22" stroke="#cfe9f2" stroke-width="2">
    <path d="M0 478 H1280"/>
    <path d="M70 520 H1210 M120 570 H1160 M180 620 H1100"/>
  </g>
  <g transform="translate(92 92)">
    <rect x="0" y="0" width="360" height="48" rx="8" fill="#f3f8f6"/>
    <text x="24" y="32" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="800" fill="#142231">HARDWARE / INFRA</text>
  </g>
  <g transform="translate(98 180)">
    <text x="0" y="0" font-family="Inter, Arial, sans-serif" font-size="70" font-weight="800" fill="#ffffff">PADUCAH</text>
    <text x="0" y="82" font-family="Inter, Arial, sans-serif" font-size="70" font-weight="800" fill="#ffffff">AI ENERGY</text>
    <text x="0" y="164" font-family="Inter, Arial, sans-serif" font-size="70" font-weight="800" fill="#ffffff">CAMPUS</text>
    <rect x="0" y="202" width="560" height="12" fill="url(#power)"/>
    <text x="0" y="270" font-family="Inter, Arial, sans-serif" font-size="30" fill="#d9eef7">1.8GW HPC + 2GW generation + 2.6GW storage</text>
  </g>
  <g transform="translate(720 172)" fill="none" stroke-linejoin="round">
