    <path d="M0 170 L70 95 H430 L360 170 Z" fill="#344552" stroke="#86d7ef" stroke-width="4"/>
    <path d="M360 170 L430 95 V240 L360 320 Z" fill="#202a32" stroke="#86d7ef" stroke-width="4"/>
    <g stroke="#8fd14f" stroke-width="5">
